# Managed by the Primeboard deployment script.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name rainboard.jacksonwalters.com;

    ssl_certificate /etc/letsencrypt/live/rainboard.jacksonwalters.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rainboard.jacksonwalters.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://primeboard.jacksonwalters.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name rainboard.jacksonwalters.com;
    # Retain the original Certbot webroot for the redirect's certificate.
    root /var/www/rainboard.jacksonwalters.com/current;
    location /.well-known/acme-challenge/ { try_files $uri =404; }
    location / { return 301 https://primeboard.jacksonwalters.com$request_uri; }
}
