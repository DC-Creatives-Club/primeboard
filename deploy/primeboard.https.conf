# Managed by the Primeboard deployment script.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name primeboard.jacksonwalters.com;

    ssl_certificate /etc/letsencrypt/live/primeboard.jacksonwalters.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/primeboard.jacksonwalters.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/primeboard.jacksonwalters.com/current;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cache-Control "no-cache" always;

    location / { try_files $uri $uri/ =404; }
}

server {
    listen 80;
    listen [::]:80;
    server_name primeboard.jacksonwalters.com;
    root /var/www/primeboard.jacksonwalters.com/current;
    location /.well-known/acme-challenge/ { try_files $uri =404; }
    location / { return 301 https://primeboard.jacksonwalters.com$request_uri; }
}
