# Managed by the Primeboard deployment script.
server {
    listen 80;
    listen [::]:80;
    server_name primeboard.jacksonwalters.com;
    root /var/www/primeboard.jacksonwalters.com/current;
    index index.html;

    location /.well-known/acme-challenge/ { try_files $uri =404; }
    location / { try_files $uri $uri/ =404; }
}
