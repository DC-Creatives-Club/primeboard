name: Desktop builds

on:
  workflow_dispatch:
    inputs:
      prepare_release:
        description: Verify packages and upload a draft GitHub release
        type: boolean
        default: false
  push:
    branches: [master, codex/desktop-apps]
    paths: ['web/**', 'desktop/**', 'scripts/desktop-*', 'tests/**', 'package*.json', 'forge.config.mjs', '.gitattributes', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['web/**', 'desktop/**', 'scripts/desktop-*', 'tests/**', 'package*.json', 'forge.config.mjs', '.gitattributes', '.github/workflows/desktop.yml']

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && 'manual' || 'automatic' }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        # Pushes and pull requests check the Pi; manual runs prepare both Linux targets.
        include: >-
          ${{ fromJSON(github.event_name == 'workflow_dispatch' && '[
            {"name":"Linux x64","os":"ubuntu-22.04","arch":"x64","platform":"linux"},
            {"name":"Linux ARM64 (Pi 5)","os":"ubuntu-22.04-arm","arch":"arm64","platform":"linux"}
          ]' || '[
            {"name":"Linux ARM64 (Pi 5)","os":"ubuntu-22.04-arm","arch":"arm64","platform":"linux"}
          ]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fakeroot
      - run: npm ci
      - run: npm test
      - run: npm run desktop:make -- --arch=${{ matrix.arch }}
      - name: Verify Debian and Ubuntu installation
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          packages=(out/make/deb/*/*.deb)
          test "${#packages[@]}" -eq 1
          bash scripts/desktop-test-install.sh "${packages[0]}"
      - run: npm run desktop:checksums
      - uses: actions/upload-artifact@v4
        with:
          name: Primeboard-${{ matrix.platform }}-${{ matrix.arch }}
          path: out/make/
          if-no-files-found: error
          retention-days: 30

  prepare-release:
    name: Prepare draft Linux release
    if: github.event_name == 'workflow_dispatch' && inputs.prepare_release
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_DIR: /tmp/primeboard-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          pattern: Primeboard-linux-*
          path: ${{ env.RELEASE_DIR }}/artifacts
      - name: Verify and name release packages
        run: |
          python3 scripts/desktop-prepare-release.py "$RELEASE_DIR"
          node scripts/desktop-verify-payloads.mjs "$RELEASE_DIR"
      - name: Upload draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          gh release create "v$version" "$RELEASE_DIR"/release/* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft \
            --title "Primeboard $version — Linux desktop" \
            --notes-file "desktop/releases/v$version.md"
