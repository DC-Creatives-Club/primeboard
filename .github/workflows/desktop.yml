name: Desktop builds

on:
  workflow_dispatch:
  push:
    branches: [master, codex/desktop-apps]
    paths: ['web/**', 'desktop/**', 'scripts/desktop-*', 'tests/**', 'package*.json', 'forge.config.mjs', '.gitattributes', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['web/**', 'desktop/**', 'scripts/desktop-*', 'tests/**', 'package*.json', 'forge.config.mjs', '.gitattributes', '.github/workflows/desktop.yml']

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && 'manual' || 'automatic' }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        # Pushes and pull requests check the Pi; manual runs prepare both Linux targets.
        include: >-
          ${{ fromJSON(github.event_name == 'workflow_dispatch' && '[
            {"name":"Linux x64","os":"ubuntu-22.04","arch":"x64","platform":"linux"},
            {"name":"Linux ARM64 (Pi 5)","os":"ubuntu-22.04-arm","arch":"arm64","platform":"linux"}
          ]' || '[
            {"name":"Linux ARM64 (Pi 5)","os":"ubuntu-22.04-arm","arch":"arm64","platform":"linux"}
          ]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fakeroot
      - run: npm ci
      - run: npm test
      - run: npm run desktop:make -- --arch=${{ matrix.arch }}
      - run: npm run desktop:checksums
      - uses: actions/upload-artifact@v4
        with:
          name: Primeboard-${{ matrix.platform }}-${{ matrix.arch }}
          path: out/make/
          if-no-files-found: error
          retention-days: 30
